name: Build MintooSuite Sovereign Elite Native APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Stable Gradle 8.1.1 & Build APK
        run: |
          wget https://services.gradle.org/distributions/gradle-8.1.1-bin.zip
          unzip -q gradle-8.1.1-bin.zip
          export PATH=$PWD/gradle-8.1.1/bin:$PATH
          gradle wrapper --gradle-version 8.1.1
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload Sovereign APK Package
        uses: actions/upload-artifact@v4
        with:
          name: MintooSuite-Sovereign-Elite-v1.0.0-APK
          path: app/build/outputs/apk/release/*.apk
